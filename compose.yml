services:
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9095'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:9095,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: '6ealAULVRvG5YVVm1PVi4w'
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  create-topics:
    image: confluentinc/cp-kafka:7.7.1
    container_name: create-topics
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["kafka-topics"]
    command:
      - "--bootstrap-server"
      - "kafka:29092"
      - "--create"
      - "--if-not-exists"
      - "--topic"
      - "kafka-envelope"
      - "--partitions"
      - "3"

  control-center:
    image: confluentinc/cp-enterprise-control-center:7.7.1
    hostname: control-center
    container_name: control-center
    depends_on:
      - kafka
    ports:
      - "9021:9021"
    environment:
      CONTROL_CENTER_BOOTSTRAP_SERVERS: 'kafka:29092'
      CONTROL_CENTER_REPLICATION_FACTOR: 1
      CONTROL_CENTER_INTERNAL_TOPICS_PARTITIONS: 1
      CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_PARTITIONS: 1
      CONFLUENT_METRICS_TOPIC_REPLICATION: 1
      PORT: 9021
      
  floci:
    image: floci/floci:latest
    hostname: floci
    container_name: floci
    ports:
      - "4566:4566"
    volumes:
      - floci-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  create-bucket:
    image: floci/floci:latest-compat
    container_name: create-bucket
    depends_on:
      floci:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["aws"]
    command: ["s3", "mb", "s3://lakehouse", "--endpoint-url", "http://floci:4566"]

  ingestion:
    build:
      context: .
      dockerfile: packages/ingestion/Dockerfile
    container_name: ingestion
    depends_on:
      create-topics:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: 'kafka:29092'

  bronze-job:
    build:
      context: .
      dockerfile: packages/lakehouse/Dockerfile
    container_name: bronze-job
    depends_on:
      create-topics:
        condition: service_completed_successfully
      create-bucket:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: 'kafka:29092'
      S3_ENDPOINT_URL: 'http://floci:4566'
    command: ["uv", "run", "python", "-m", "lakehouse.jobs.bronze_job"]

  silver-agg-trade-job:
      build:
        context: .
        dockerfile: packages/lakehouse/Dockerfile
      container_name: silver-agg-trade-job
      depends_on:
        bronze-job:
          condition: service_started
        create-bucket:
          condition: service_completed_successfully
      env_file:
        - .env
      environment:
        S3_ENDPOINT_URL: 'http://floci:4566'
      command: ["uv", "run", "python", "-m", "lakehouse.jobs.silver.silver_agg_trade_job"]

  silver-book-ticker-job:
    build:
      context: .
      dockerfile: packages/lakehouse/Dockerfile
    container_name: silver-book-ticker-job
    depends_on:
      bronze-job:
        condition: service_started
      create-bucket:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      S3_ENDPOINT_URL: 'http://floci:4566'
    command: ["uv", "run", "python", "-m", "lakehouse.jobs.silver.silver_book_ticker_job"]

  silver-depth10-job:
    build:
      context: .
      dockerfile: packages/lakehouse/Dockerfile
    container_name: silver-depth10-job
    depends_on:
      bronze-job:
        condition: service_started
      create-bucket:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      S3_ENDPOINT_URL: 'http://floci:4566'
    command: ["uv", "run", "python", "-m", "lakehouse.jobs.silver.silver_depth10_job"]

  gold-volatility-job:
    build:
      context: .
      dockerfile: packages/lakehouse/Dockerfile
    container_name: gold-volatility-job
    depends_on:
      silver-agg-trade-job:
        condition: service_started
      create-bucket:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      S3_ENDPOINT_URL: 'http://floci:4566'
    command: ["uv", "run", "python", "-m", "lakehouse.jobs.gold.gold_volatility_job"]

  gold-spread-job:
    build:
      context: .
      dockerfile: packages/lakehouse/Dockerfile
    container_name: gold-spread-job
    depends_on:
      silver-book-ticker-job:
        condition: service_started
      create-bucket:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      S3_ENDPOINT_URL: 'http://floci:4566'
    command: ["uv", "run", "python", "-m", "lakehouse.jobs.gold.gold_spread_job"]

  gold-liquidity-job:
    build:
      context: .
      dockerfile: packages/lakehouse/Dockerfile
    container_name: gold-liquidity-job
    depends_on:
      silver-depth10-job:
        condition: service_started
      create-bucket:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      S3_ENDPOINT_URL: 'http://floci:4566'
    command: ["uv", "run", "python", "-m", "lakehouse.jobs.gold.gold_liquidity_job"]

volumes:
  floci-data: