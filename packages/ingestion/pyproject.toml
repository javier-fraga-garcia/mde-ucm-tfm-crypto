[project]
name = "ingestion"
version = "0.1.0"
description = "Paquete de ingesta y conexión con los websockets"
readme = "README.md"
authors = [
    { name = "Javier Fraga García", email = "javierfrga@proton.me" }
]
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.14.0",
    "shared",
    "tenacity>=9.1.4",
    "websockets>=16.1",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
shared = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
